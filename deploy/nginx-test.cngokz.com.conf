# CNGOKZAPI unified frontend + API (OpenResty / 1Panel)
#
# Host path:
#   /mnt/1panel/apps/openresty/openresty/www/sites/test.cngokz.com/index/cnapi
# OpenResty container path:
#   /www/sites/test.cngokz.com/index/cnapi
#
# Required files directly under cnapi/:
#   index.html
#   assets/
#   robots.txt
#   sitemap.xml
#   bin/cngokz-api (not served by OpenResty)
#   .env (not served by OpenResty)

server {
    listen 80 ;
    listen 443 ssl http2 ;
    server_name test.cngokz.com; 
    index index.html; 

    proxy_set_header Host $host; 
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; 
    proxy_set_header X-Forwarded-Host $server_name; 
    proxy_set_header X-Real-IP $remote_addr; 
    proxy_http_version 1.1; 
    proxy_set_header Upgrade $http_upgrade; 
    proxy_set_header Connection $http_connection; 
    proxy_set_header X-Forwarded-Proto https; 
    proxy_redirect off; 

    access_log /www/sites/test.cngokz.com/log/access.log main; 
    error_log /www/sites/test.cngokz.com/log/error.log; 
    client_max_body_size 20m; 

    # Unified frontend root. Do not use public/ or admin/ subdirectories.
    root /www/sites/test.cngokz.com/index/cnapi;

    location ^~ /.well-known/acme-challenge {
        allow all; 
        root /usr/share/nginx/html; 
    }

    if ($scheme = http) {
        return 301 https://$host$request_uri; 
    }

    ssl_certificate /www/sites/test.cngokz.com/ssl/fullchain.pem; 
    ssl_certificate_key /www/sites/test.cngokz.com/ssl/privkey.pem; 
    ssl_protocols TLSv1.3 TLSv1.2 TLSv1.1 TLSv1; 
    ssl_ciphers HIGH:!aNULL:!MD5; 
    ssl_prefer_server_ciphers on; 
    ssl_session_cache shared:SSL:10m; 
    ssl_session_timeout 10m; 
    error_page 497 https://$host$request_uri; 
    add_header Strict-Transport-Security "max-age=31536000"; 

    # API
    location /api/ {
        proxy_pass http://127.0.0.1:28080; 
        proxy_connect_timeout 10s; 
        proxy_send_timeout 60s; 
        proxy_read_timeout 60s; 
    }

    # 健康检查
    location = /health {
        proxy_pass http://127.0.0.1:28080; 
    }

    location /health/ {
        proxy_pass http://127.0.0.1:28080; 
    }

    # Swagger UI
    location /swagger-ui {
        proxy_pass http://127.0.0.1:28080; 
    }

    # OpenAPI JSON
    location /api-docs/ {
        proxy_pass http://127.0.0.1:28080; 
    }

    # 管理后台入口：统一 SPA 的 /admin/ 路由
    location = /admin {
        return 308 /admin/; 
    }

    location /admin/ {
        try_files $uri $uri/ /index.html =404; 
    }

    # 兼容旧版 /admin/assets/ 请求（统一构建后实际资源都在 /assets/）
    location ^~ /admin/assets/ {
        rewrite ^/admin/assets/(.*)$ /assets/$1 last;
    }

    # 前端静态资源
    location ^~ /assets/ {
        expires 1y; 
        add_header Cache-Control "public, immutable"; 
        try_files $uri =404; 
    }

    # 公开门户 + 管理后台，全部交给同一个 index.html
    location / {
        try_files $uri $uri/ /index.html =404; 
    }
}
