# CNGOKZAPI native deployment
#   public portal: /var/www/cngokzapi/public
#   admin portal:  /var/www/cngokzapi/admin
#   API:           http://127.0.0.1:8080
#
# Install:
#   cp deploy/nginx-ban.cngokz.com.conf /etc/nginx/conf.d/cngokzapi.conf
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name ban.cngokz.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ban.cngokz.com;

    # Keep your existing certificate paths; adjust if needed.
    ssl_certificate     /etc/letsencrypt/live/ban.cngokz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ban.cngokz.com/privkey.pem;

    client_max_body_size 20m;

    # API and health endpoints
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /swagger-ui {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api-docs/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin SPA. Vite uses base=/admin/.
    location /admin/ {
        root /var/www/cngokzapi;
        try_files $uri $uri/ /admin/index.html;
    }

    location /admin {
        return 308 /admin/;
    }

    # Hashed assets: cache aggressively.
    location ^~ /admin/assets/ {
        root /var/www/cngokzapi;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ^~ /assets/ {
        root /var/www/cngokzapi/public;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Public portal SPA. This is the default site.
    location / {
        root /var/www/cngokzapi/public;
        try_files $uri $uri/ /index.html;
    }
}
