# Redis configuration used by docker compose (development and production).
# Authentication is intentionally not configured: Redis is only reachable on the
# internal compose network and the host loopback interface.

# Persistence: append-only file with a background snapshot fallback.
appendonly yes
appendfsync everysec

save 900 1
save 300 10

dir /data

# Keep memory bounded; the API only uses Redis for caching so evicting keys is
# safe in this phase.
maxmemory 256mb
maxmemory-policy allkeys-lru

# Bind inside the container network; access is restricted by compose port
# publishing (127.0.0.1 only) and the internal network.
bind 0.0.0.0
protected-mode yes
tcp-keepalive 60
