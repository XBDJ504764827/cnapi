name: cngokzapi-dev

# ---------------------------------------------------------------------------
# Development dependencies only: PostgreSQL + Redis.
#
#   docker compose -f docker-compose.dev.yml up -d
#   docker compose -f docker-compose.dev.yml down
#
# Run the API and the web app natively (see docs/development.md) so hot reload
# works. Publishing on localhost is intentional for local tooling.
# ---------------------------------------------------------------------------

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cngokz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cngokz}
      POSTGRES_DB: ${POSTGRES_DB:-cngokzapi}
      TZ: UTC
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data-dev:/var/lib/postgresql
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ['redis-server', '/usr/local/etc/redis/redis.conf']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data-dev:/data
      - ./infrastructure/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data-dev:
    name: cngokzapi-postgres-data-dev
  redis-data-dev:
    name: cngokzapi-redis-data-dev
