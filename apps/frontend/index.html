<!doctype html>
<html lang="zh-CN" class="dark h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#16181c" />
    <title>CNGOKZ · CS:GO KZ 数据平台</title>
    <meta
      name="description"
      content="CNGOKZ 是面向 CS:GO KZ 社区的公开数据平台：排行榜、玩家资料、地图进度、成绩与服务器状态。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CNGOKZ" />
    <meta property="og:title" content="CNGOKZ · CS:GO KZ 数据平台" />
    <meta property="og:description" content="CS:GO KZ 排行榜、玩家资料、地图完成度、成绩与服务器状态。" />
    <meta name="twitter:card" content="summary" />
    <script>
      // Applies the theme for the active site section before first paint.
      (function () {
        try {
          var isAdmin = window.location.pathname === '/admin' || window.location.pathname.indexOf('/admin/') === 0;
          var key = isAdmin ? 'cngokz-ui' : 'cngokz-public-ui';
          var stored = JSON.parse(localStorage.getItem(key) || '{}');
          var theme = (stored.state && stored.state.theme) || 'dark';
          var dark =
            theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (error) {
          /* ignore invalid storage */
        }
      })();
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
