name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (fmt, clippy, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: cngokz
          POSTGRES_PASSWORD: cngokz
          POSTGRES_DB: cngokzapi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cngokz -d cngokzapi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgres://cngokz:cngokz@localhost:5432/cngokzapi
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --all-targets

      - name: OpenAPI document is up to date
        run: |
          cargo run --quiet --bin dump-openapi -- docs/openapi.json
          pnpm --filter @cngokz/shared-types gen:api >/dev/null
          git diff --exit-code -- docs/openapi.json packages/shared-types/src/generated/api-schema.d.ts

  web:
    name: Web (lint, typecheck, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r lint
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm --filter @cngokz/web build
      - run: pnpm --filter @cngokz/public build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Build API image
        run: docker build -f infrastructure/docker/api.Dockerfile -t cngokzapi-api:ci .

      - name: Build web image
        run: docker build -f infrastructure/docker/web.Dockerfile -t cngokzapi-web:ci .

      - name: Build public portal image
        run: docker build -f infrastructure/docker/public.Dockerfile -t cngokzapi-public:ci .
