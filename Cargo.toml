[workspace]
resolver = "3"
members = ["apps/api"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/cngokz/cngokzapi"

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["macros"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
dotenvy = "0.15"
redis = { version = "1", default-features = false, features = [
  "tokio-comp",
  "connection-manager",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls-ring-webpki",
  "postgres",
  "chrono",
  "uuid",
  "json",
  "migrate",
  "macros",
  "bigdecimal",
  "ipnetwork",
] }
thiserror = "2"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "signal",
  "time",
] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = [
  "cors",
  "trace",
  "request-id",
  "timeout",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
utoipa = { version = "6", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "10", features = ["axum", "vendored"] }
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
strip = true
